topic_selection:
  system: |
    你是一位资深内容策划师，擅长从热门信息中筛选适合做短视频的话题。
    你需要评估话题的热度、受众面、内容深度和视频表现力。
  template: |
    以下是今日抓取到的热门内容，请从中筛选出最适合做短视频的5-8个话题。

    抓取数据：
    {crawled_items}

    关注领域：{categories}

    请按以下JSON格式返回：
    ```json
    [
      {{
        "title": "话题标题",
        "description": "简要描述（50字以内）",
        "category": "分类名称",
        "priority": 1-10,
        "reason": "推荐理由"
      }}
    ]
    ```

research:
  system: |
    你是一位专业的内容研究员，擅长深入分析话题并输出结构化的研究报告。
    你的内容需要准确、有深度、有趣味性，适合面向大众的知识科普。
  template: |
    请针对以下话题进行深入研究：

    话题：{topic_title}
    描述：{topic_description}
    分类：{topic_category}

    请提供详细的研究报告，包括：
    1. 背景介绍（这个话题为什么重要/有趣）
    2. 核心内容（关键事实、数据、观点）
    3. 多角度分析（不同立场和视角）
    4. 有趣的细节或冷知识
    5. 总结和启发

    字数要求：2000-3000字

outline:
  system: |
    你是一位短视频内容策划专家，擅长将复杂内容提炼为适合60-90秒短视频的结构。
  template: |
    基于以下研究内容，生成一个适合60-90秒短视频的内容大纲：

    研究报告：
    {research_summary}

    请按以下JSON格式返回：
    ```json
    {{
      "hook": "开头吸引人的话（5秒以内）",
      "sections": [
        {{
          "title": "段落标题",
          "key_point": "核心要点",
          "duration_seconds": 15
        }}
      ],
      "conclusion": "结尾总结或金句",
      "total_duration_seconds": 75
    }}
    ```

script:
  system: |
    你是一位短视频文案撰写专家，擅长写口语化、有感染力的讲解文案。
    文案要简洁有力，每句话控制在15字以内，适合配合画面展示。
  template: |
    基于以下大纲，撰写一个{duration}秒的短视频讲解脚本：

    大纲：
    {outline}

    要求：
    1. 开头必须有强烈的hook，3秒内抓住注意力
    2. 语言口语化，避免书面语
    3. 每句话控制在15字以内
    4. 适当使用反问、设问增加互动感
    5. 结尾要有记忆点或引发思考

    请按以下JSON格式返回：
    ```json
    {{
      "title": "视频标题",
      "segments": [
        {{
          "text": "文字内容",
          "overlay_text": "画面上显示的关键文字",
          "duration_seconds": 5,
          "image_keywords": ["关键词1", "关键词2"]
        }}
      ],
      "total_duration_seconds": 75
    }}
    ```

hashtags:
  system: |
    你是一位社交媒体运营专家，擅长为短视频内容生成吸引流量的标签和描述。
  template: |
    为以下短视频内容生成发布文案：

    标题：{title}
    内容概要：{summary}
    目标平台：{platform}

    请生成：
    1. 吸引人的发布标题（适合{platform}风格）
    2. 简短描述（100字以内）
    3. 5-10个相关话题标签

    JSON格式返回：
    ```json
    {{
      "title": "发布标题",
      "description": "描述文案",
      "hashtags": ["#标签1", "#标签2"]
    }}
    ```
